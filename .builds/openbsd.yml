image: openbsd/latest
sources:
  - https://github.com/realchonk/bmk
  - https://github.com/realchonk/desktop
packages:
  - tcc
  - expect
tasks:
  - build-bootstrap: |
      cd bmk
      ./configure
      make
      doas make install
      make distclean
  - build-tcc: |
      cd bmk
      CC=tcc ./configure
      mk
      doas mk install
      mk distclean
  - build-self: |
      cd bmk
      ./configure
      mk
      doas mk install
  - build-desktop: |
      # build one of my projects that use bmk, to verify that everything works
      cd desktop
      mk -o obj
      mk -o obj DESTDIR=$PWD/_install install install-etc
      find _install
  - build-211bsd: |
      cd bmk
      ./retroci-unix50 211
  - build-43bsd: |
      cd bmk
      ./retroci-unix50 43
